log_dir: "Models/Kokoro2FT"
kokoro_config_path: "Configs/config.json"
save_freq: 3
log_interval: 10
device: "cuda"
epochs: 16
batch_size: 6
diff_epoch: 0
pretrained_model: "models/kokoro-v0_19.pth"

F0_path: "Utils/JDC/bst.t7"
ASR_config: "Utils/ASR/config.yml"
ASR_path: "Utils/ASR/epoch_00080.pth"
PLBERT_dir: 'Utils/PLBERT/'

data_params:
  train_data: "Data/train_list_small.txt"
  val_data: "Data/val_list_new.txt"
  root_path: "Data/wavs"
  OOD_data: "Data/OOD.txt"
  min_length: 50

preprocess_params:
  sr: 24000
  spect_params:
    n_fft: 2048
    win_length: 1200
    hop_length: 300

model_params:
  multispeaker: false
  dim_in: 64
  hidden_dim: 512
  max_conv_dim: 512
  n_layer: 3
  n_mels: 80
  n_token: 178
  max_dur: 50
  style_dim: 128
  dropout: 0.2
  
  decoder:
    type: "istftnet"
    upsample_kernel_sizes: [20, 12]
    upsample_rates: [10, 6]
    gen_istft_hop_size: 5
    gen_istft_n_fft: 20
    resblock_dilation_sizes: [[1, 3, 5], [1, 3, 5], [1, 3, 5]]
    resblock_kernel_sizes: [3, 7, 11]
    upsample_initial_channel: 512

  slm:
    model: 'microsoft/wavlm-base-plus'
    sr: 16000
    hidden: 768
    nlayers: 13
    initial_channel: 64

  diffusion:
    embedding_mask_proba: 0.1
    transformer:
      num_layers: 3
      num_heads: 8
      head_features: 64
      multiplier: 2
    dist:
      sigma_data: 0.2
      estimate_sigma_data: true
      mean: -3.0
      std: 1.0

optimizer_params:
  lr: 0.0001          
  bert_lr: 0.00001    

loss_weights:
  mel: 1.0            
  f0: 0.1            
  n: 0.1              
  style: 1.0          
  diffusion: 1.0      
